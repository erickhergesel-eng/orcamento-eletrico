<script>
  function baixarPDF() {
    // 1. Rola a página para o topo (evita tela branca no celular)
    window.scrollTo(0, 0);

    // 2. Captura apenas a div do recibo/orçamento impresso
    const elemento = document.getElementById('area-do-orcamento');

    const opcoes = {
      margin:       [8, 8, 8, 8],
      filename:     'Orcamento_ERTEC.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { 
        scale: 2, 
        useCORS: true, 
        scrollX: 0, 
        scrollY: 0 
      },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // Gera o PDF mantendo todo o seu app funcionando
    html2pdf().set(opcoes).from(elemento).save();
  }
</script>
