<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erick Hergesel - ERTEC SOLUÇÕES ELÉTRICAS</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 15px;
      color: #333;
    }
    
    .orcamento-container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff; 
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header-app {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 2px solid #0c3866;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .header-app img {
      height: 50px;
      width: auto;
    }

    .header-app .titulo { flex: 1; }

    .header-app h2 {
      margin: 0;
      font-size: 18px;
      color: #0c3866;
    }

    .header-app p {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #0c3866;
      color: white;
      font-size: 13px;
    }

    input, select {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .total-container {
      text-align: right;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      color: #0c3866;
    }

    .controles {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .btn-add { background-color: #27ae60; color: white; }
    .btn-print { background-color: #2980b9; color: white; }
    .btn-remove { background-color: #c0392b; color: white; padding: 4px 8px; }

    @media print {
      body { background: none; padding: 0; }
      .controles, .btn-remove { display: none !important; }
      .orcamento-container { box-shadow: none; width: 100%; padding: 0; }
    }
  </style>
</head>
<body>

<div class="orcamento-container" id="orcamento">
  <div class="header-app">
    <img src="logo.png" alt="ERTEC Logo" id="logo-img">
    <div class="titulo">
      <h2>ERTEC SOLUÇÕES ELÉTRICAS</h2>
      <p>Erick Hergesel - Elétrica, Climatização & Segurança</p>
    </div>
  </div>

  <table id="tabela-itens">
    <thead>
      <tr>
        <th style="width: 10%;">QTD</th>
        <th style="width: 52%;">DESCRIÇÃO DO SERVIÇO / MATERIAL</th>
        <th style="width: 18%;">VALOR UNIT.</th>
        <th style="width: 15%;">SUBTOTAL</th>
        <th class="controles" style="width: 5%;">AÇÃO</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <tr>
        <td><input type="number" value="1" min="1" onchange="calcularTotal()" class="qtd" style="width: 100%;"></td>
        <td>
          <select onchange="atualizarDescricao(this)" class="select-servico" style="width: 100%;">
            <option value="custom">-- Digitar Item Personalizado --</option>
            
            <optgroup label="Iluminação & Sensores">
              <option value="Arandela, Pendente ou Spot Comum" data-preco="55.00">Arandela, Pendente ou Spot Comum</option>
              <option value="Lâmpada Fluorescente / LED (Tubular)" data-preco="60.00">Lâmpada Fluorescente / LED (Tubular)</option>
              <option value="Lustre Simples / Luminária" data-preco="80.00">Lustre Simples / Luminária</option>
              <option value="Lustre Grande / Luminária Especial" data-preco="135.00">Lustre Grande / Luminária Especial</option>
              <option value="Refletor de Jardim" data-preco="90.00">Refletor de Jardim</option>
              <option value="Refletor de Poste Comum" data-preco="110.00">Refletor de Poste Comum</option>
              <option value="Fotocélula / Sensor de Presença" data-preco="85.00">Fotocélula / Sensor de Presença</option>
              <option value="Refletor LED + Fotocélula / Sensor" data-preco="60.00">Refletor LED + Fotocélula / Sensor</option>
              <option value="Instalação Perfil de LED (Metro Linear)" data-preco="140.00">Instalação Perfil de LED (Metro)</option>
              <option value="Luminária de Emergência (Sobrepor)" data-preco="90.00">Luminária de Emergência (Sobrepor)</option>
              <option value="Luminária de Emergência (Embutir 2x4)" data-preco="50.00">Luminária de Emergência (Embutir)</option>
              <option value="Interruptor Simples ou Pulsador" data-preco="50.00">Interruptor Simples ou Pulsador</option>
              <option value="Interruptor Three-Way / Four-Way" data-preco="50.00">Interruptor Three-Way / Four-Way</option>
              <option value="Interruptor + Tomada (Juntos)" data-preco="50.00">Interruptor + Tomada (Juntos)</option>
            </optgroup>

            <optgroup label="Tomadas & Pontos Elétricos">
              <option value="Tomada Simples" data-preco="30.00">Tomada Simples</option>
              <option value="Tomada Dupla" data-preco="40.00">Tomada Dupla</option>
              <option value="Tomada Tripla" data-preco="50.00">Tomada Tripla</option>
              <option value="Tomada de Piso / Telefone" data-preco="50.00">Tomada de Piso / Telefone</option>
              <option value="Tomada Industrial (3P+T)" data-preco="80.00">Tomada Industrial (3P+T)</option>
              <option value="Tomada de Sobrepor com Canaleta" data-preco="60.00">Tomada de Sobrepor com Canaleta</option>
              <option value="Campainha (Até 20m)" data-preco="60.00">Campainha (Até 20m)</option>
            </optgroup>

            <optgroup label="Equipamentos Residencias & Chuveiros">
              <option value="Ventilador de Teto" data-preco="120.00">Ventilador de Teto</option>
              <option value="Ventilador de Parede" data-preco="90.00">Ventilador de Parede</option>
              <option value="Chuveiro Elétrico Simples" data-preco="80.00">Chuveiro Elétrico Simples</option>
              <option value="Chuveiro Luxo (Eletrônico / Pressurizado / Ducha)" data-preco="135.00">Chuveiro Luxo (Ducha / Pressurizado)</option>
              <option value="Troca de Resistência de Chuveiro" data-preco="70.00">Troca de Resistência de Chuveiro</option>
              <option value="Torneira Elétrica" data-preco="80.00">Torneira Elétrica</option>
              <option value="Exaustor Cozinha ou Banheiro" data-preco="200.00">Exaustor Cozinha ou Banheiro</option>
              <option value="Chave de Boia Superior / Inferior" data-preco="120.00">Chave de Boia Superior / Inferior</option>
            </optgroup>

            <optgroup label="Quadros, Proteção & Entrada">
              <option value="Substituição de Disjuntor Monofásico" data-preco="40.00">Substituição de Disjuntor Monofásico</option>
              <option value="Substituição de Disjuntor Bifásico" data-preco="60.00">Substituição de Disjuntor Bifásico</option>
              <option value="Substituição de Disjuntor Trifásico" data-preco="90.00">Substituição de Disjuntor Trifásico</option>
              <option value="Instalação de IDR (Interruptor Diferencial Residual)" data-preco="110.00">Instalação de IDR</option>
              <option value="Instalação de DPS (Proteção de Surtos)" data-preco="95.00">Instalação de DPS</option>
              <option value="Barramento de Neutro e/ou Terra" data-preco="65.00">Barramento de Neutro e/ou Terra</option>
              <option value="Instalação de Haste de Aterramento" data-preco="160.00">Instalação de Haste de Aterramento</option>
              <option value="Montagem QDC (6 Circuitos + DR + DPS)" data-preco="460.00">Montagem QDC (6 Circuitos + DR + DPS)</option>
              <option value="Montagem QDC (12 Circuitos + DR + DPS)" data-preco="700.00">Montagem QDC (12 Circuitos + DR + DPS)</option>
              <option value="Montagem QDC (18 Circuitos + DR + DPS)" data-preco="875.00">Montagem QDC (18 Circuitos + DR + DPS)</option>
              <option value="Instalação de Medidor Monofásico (Padrão Entrada)" data-preco="1000.00">Instalação de Medidor Monofásico</option>
              <option value="Instalação de Medidor Bifásico (Padrão Entrada)" data-preco="1200.00">Instalação de Medidor Bifásico</option>
            </optgroup>

            <optgroup label="Câmeras, Segurança & Automação">
              <option value="Câmera CFTV Wi-Fi (Sem ponto elétrico)" data-preco="130.00">Câmera CFTV Wi-Fi</option>
              <option value="Interfone (1 Chamada)" data-preco="130.00">Interfone (1 Chamada)</option>
              <option value="Videoporteiro" data-preco="160.00">Videoporteiro</option>
              <option value="Fechadura Eletrônica (Portão Social)" data-preco="130.00">Fechadura Eletrônica (Portão Social)</option>
              <option value="Botoeira para Fechadura Eletrônica" data-preco="50.00">Botoeira para Fechadura Eletrônica</option>
              <option value="Portão Eletrônico Deslizante" data-preco="230.00">Portão Eletrônico Deslizante</option>
              <option value="Portão Eletrônico Pivotante / Basculante" data-preco="460.00">Portão Eletrônico Pivotante/Basculante</option>
              <option value="Instalação de Sistema de Alarme Residencial" data-preco="700.00">Sistema de Alarme Residencial</option>
              <option value="Instalação de Cerca Elétrica (por Metro)" data-preco="50.00">Instalação de Cerca Elétrica (Metro)</option>
            </optgroup>

            <optgroup label="Climatização & Emergência">
              <option value="Alimentação Elétrica para Ar Condicionado" data-preco="90.00">Alimentação Elétrica p/ Ar Condicionado</option>
              <option value="Limpeza em Tubulação de Ar Condicionado" data-preco="50.00">Limpeza em Tubulação de Ar Condicionado</option>
              <option value="Instalação Ar Split Inverter 9000 BTUs" data-preco="450.00">Instalação Ar Split Inverter 9000 BTUs</option>
              <option value="Instalação Ar Split Inverter 12000 BTUs" data-preco="450.00">Instalação Ar Split Inverter 12000 BTUs</option>
              <option value="Instalação Ar Split Inverter 18000 BTUs" data-preco="550.00">Instalação Ar Split Inverter 18000 BTUs</option>
              <option value="Atendimento Técnico Emergencial (Durante a semana)" data-preco="150.00">Atendimento Emergencial (Semana)</option>
              <option value="Atendimento Técnico Emergencial (Final de semana)" data-preco="210.00">Atendimento Emergencial (Fim de Semana)</option>
            </optgroup>
          </select>
          <input type="text" placeholder="Descrição personalizada..." class="desc-custom" style="width: 100%; margin-top: 5px;">
        </td>
        <td><input type="number" step="0.01" value="0.00" onchange="calcularTotal()" class="preco" style="width: 100%;"></td>
        <td class="subtotal">R$ 0,00</td>
        <td class="controles"><button class="btn-remove" onclick="removerLinha(this)">X</button></td>
      </tr>
    </tbody>
  </table>

  <div class="controles">
    <button class="btn-add" onclick="adicionarLinha()">+ Adicionar Item</button>
    <button class="btn-print" onclick="window.print()">Imprimir / Salvar PDF</button>
  </div>

  <div class="total-container">
    VALOR TOTAL: <span id="valor-total">R$ 0,00</span>
  </div>

  <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 8px; font-size: 11px; color: #666;">
    <p style="margin: 0 0 5px 0;"><strong>Condições Gerais:</strong></p>
    <p style="margin: 2px 0;">• Pagamento: 50% na aprovação e 50% na conclusão.</p>
    <p style="margin: 2px 0;">• Validade: 15 dias. | Garantia: 90 dias.</p>
  </div>
</div>

<script>
  function atualizarDescricao(select) {
    const row = select.closest('tr');
    const inputCustom = row.querySelector('.desc-custom');
    const inputPreco = row.querySelector('.preco');
    const selectedOption = select.options[select.selectedIndex];

    if (select.value === 'custom') {
      inputCustom.style.display = 'block';
    } else {
      inputCustom.style.display = 'none';
      const preco = selectedOption.getAttribute('data-preco');
      if (preco) inputPreco.value = parseFloat(preco).toFixed(2);
    }
    calcularTotal();
  }

  function calcularTotal() {
    let total = 0;
    const linhas = document.querySelectorAll('#corpo-tabela tr');

    linhas.forEach(linha => {
      const qtd = parseFloat(linha.querySelector('.qtd').value) || 0;
      const preco = parseFloat(linha.querySelector('.preco').value) || 0;
      const subtotal = qtd * preco;

      linha.querySelector('.subtotal').innerText = subtotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      total += subtotal;
    });

    document.getElementById('valor-total').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function adicionarLinha() {
    const corpo = document.getElementById('corpo-tabela');
    const primeiraLinha = corpo.querySelector('tr');
    const novaLinha = primeiraLinha.cloneNode(true);

    novaLinha.querySelector('.qtd').value = 1;
    novaLinha.querySelector('.preco').value = '0.00';
    novaLinha.querySelector('.subtotal').innerText = 'R$ 0,00';
    novaLinha.querySelector('.select-servico').selectedIndex = 0;
    novaLinha.querySelector('.desc-custom').style.display = 'block';
    novaLinha.querySelector('.desc-custom').value = '';

    corpo.appendChild(novaLinha);
    calcularTotal();
  }

  function removerLinha(btn) {
    const linhas = document.querySelectorAll('#corpo-tabela tr');
    if (linhas.length > 1) {
      btn.closest('tr').remove();
      calcularTotal();
    }
  }

  window.onload = function() {
    calcularTotal();
  };
</script>

</body>
</html>
