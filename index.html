<script>
  let itensOrcamento = [];
  let visitas = [];
  let tipoDescontoAtual = 'RS';

  function trocarAba(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-tabs .tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function trocarSubAr(subId, btn) {
    document.querySelectorAll('.sub-ar-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.sub-tabs .sub-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(subId).style.display = 'block';
    btn.classList.add('active');
  }

  function filtrarServicos() {
    let input = document.getElementById('buscaServico').value.toLowerCase();
    let select = document.getElementById('servicoSelect');
    let options = select.getElementsByTagName('option');
    for (let i = 0; i < options.length; i++) {
      let txt = options[i].text.toLowerCase();
      options[i].style.display = txt.includes(input) ? "" : "none";
    }
  }

  function verificarItemCustomizado() {
    let select = document.getElementById('servicoSelect');
    let customBox = document.getElementById('campoCustomBox');
    if (select.value.startsWith('CUSTOM')) {
      customBox.style.display = 'block';
    } else {
      customBox.style.display = 'none';
    }
  }

  function adicionarItem() {
    const select = document.getElementById('servicoSelect');
    const val = select.value;
    const qtd = parseFloat(document.getElementById('servicoQtd').value) || 1;

    if (!val) {
      alert('Por favor, selecione um serviço na lista!');
      return;
    }

    let nome = '';
    let precoUnitario = 0;

    if (val.startsWith('CUSTOM')) {
      nome = document.getElementById('customNome').value.trim();
      precoUnitario = parseFloat(document.getElementById('customValor').value) || 0;
      if (!nome) {
        alert('Por favor, informe a descrição do item personalizado.');
        return;
      }
    } else {
      const partes = val.split('|');
      nome = partes[0];
      precoUnitario = parseFloat(partes[1]);
    }

    const totalItem = precoUnitario * qtd;

    itensOrcamento.push({
      id: Date.now(),
      nome: nome,
      qtd: qtd,
      unitario: precoUnitario,
      total: totalItem
    });

    select.value = '';
    document.getElementById('servicoQtd').value = '1';
    document.getElementById('customNome').value = '';
    document.getElementById('customValor').value = '0.00';
    document.getElementById('campoCustomBox').style.display = 'none';

    renderizarItens();
    calcularTotal();
  }

  function removerItem(id) {
    itensOrcamento = itensOrcamento.filter(item => item.id !== id);
    renderizarItens();
    calcularTotal();
  }

  function renderizarItens() {
    const lista = document.getElementById('listaItens');
    lista.innerHTML = '';

    itensOrcamento.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="item-info">
          <span class="item-title">${item.nome}</span>
          <span class="item-sub">${item.qtd}x R$ ${item.unitario.toFixed(2)} = <strong>R$ ${item.total.toFixed(2)}</strong></span>
        </div>
        <span class="remove-btn" onclick="removerItem(${item.id})">✕</span>
      `;
      lista.appendChild(li);
    });
  }

  function selecionarTipoDesconto(tipo) {
    tipoDescontoAtual = tipo;
    document.getElementById('btnDescRs').classList.toggle('active', tipo === 'RS');
    document.getElementById('btnDescPct').classList.toggle('active', tipo === 'PCT');
    calcularTotal();
  }

  function definirEntrada(modo) {
    let subtotal = itensOrcamento.reduce((acc, item) => acc + item.total, 0);
    let taxa = parseFloat(document.getElementById('taxaExtra').value) || 0;
    let totalBruto = subtotal + taxa;

    if (modo === 'zero') {
      document.getElementById('entradaValor').value = 0;
    } else if (modo === '30%') {
      document.getElementById('entradaValor').value = (totalBruto * 0.30).toFixed(2);
    } else if (modo === 'metade') {
      document.getElementById('entradaValor').value = (totalBruto * 0.50).toFixed(2);
    } else if (modo === 'total') {
      document.getElementById('entradaValor').value = totalBruto.toFixed(2);
    }
    calcularTotal();
  }

  function atualizarFormaPagamento() {
    const select = document.getElementById('formaPagamento');
    document.getElementById('resumoFormaPagamento').innerText = select.value;
  }

  function calcularTotal() {
    let subtotal = itensOrcamento.reduce((acc, item) => acc + item.total, 0);
    let taxa = parseFloat(document.getElementById('taxaExtra').value) || 0;
    let totalBruto = subtotal + taxa;

    let descontoInput = parseFloat(document.getElementById('descontoValor').value) || 0;
    let valorDesconto = 0;

    if (tipoDescontoAtual === 'PCT') {
      valorDesconto = totalBruto * (descontoInput / 100);
    } else {
      valorDesconto = descontoInput;
    }

    let totalComDesconto = Math.max(0, totalBruto - valorDesconto);
    
    document.getElementById('valorTotal').innerText = `R$ ${totalComDesconto.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function imprimirPDF() {
    const cliente = document.getElementById('clienteNome').value.trim() || 'Não informado';
    const contato = document.getElementById('clienteTel').value.trim() || 'Não informado';
    const hoje = new Date().toLocaleDateString('pt-BR');

    document.getElementById('pdfCliente').innerText = cliente;
    document.getElementById('pdfContato').innerText = contato;
    document.getElementById('pdfData').innerText = hoje;

    const corpoTabela = document.getElementById('pdfTabelaCorpo');
    corpoTabela.innerHTML = '';

    let subtotal = 0;

    if (itensOrcamento.length === 0) {
      corpoTabela.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum item adicionado ao orçamento.</td></tr>`;
    } else {
      itensOrcamento.forEach(item => {
        subtotal += item.total;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.nome}</td>
          <td class="col-center">${item.qtd}</td>
          <td class="col-right">R$ ${item.unitario.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
          <td class="col-right">R$ ${item.total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
        `;
        corpoTabela.appendChild(tr);
      });

      const taxa = parseFloat(document.getElementById('taxaExtra').value) || 0;
      if (taxa > 0) {
        const trTaxa = document.createElement('tr');
        trTaxa.innerHTML = `
          <td>Taxa de Materiais Extras / Deslocamento</td>
          <td class="col-center">1</td>
          <td class="col-right">R$ ${taxa.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
          <td class="col-right">R$ ${taxa.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
        `;
        corpoTabela.appendChild(trTaxa);
      }

      let totalBruto = subtotal + taxa;
      let descontoInput = parseFloat(document.getElementById('descontoValor').value) || 0;
      let valorDesconto = (tipoDescontoAtual === 'PCT') ? totalBruto * (descontoInput / 100) : descontoInput;

      if (valorDesconto > 0) {
        const trDesc = document.createElement('tr');
        trDesc.innerHTML = `
          <td colspan="3" class="col-right"><strong>Desconto Aplicado:</strong></td>
          <td class="col-right" style="color: #e74c3c;">- R$ ${valorDesconto.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
        `;
        corpoTabela.appendChild(trDesc);
      }

      let entrada = parseFloat(document.getElementById('entradaValor').value) || 0;
      if (entrada > 0) {
        const trEntrada = document.createElement('tr');
        trEntrada.innerHTML = `
          <td colspan="3" class="col-right"><strong>Entrada / Sinal:</strong></td>
          <td class="col-right">R$ ${entrada.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
        `;
        corpoTabela.appendChild(trEntrada);
      }
    }

    document.getElementById('pdfTotalValor').innerText = document.getElementById('valorTotal').innerText;

    window.print();
  }

  function calcularBTUs() {
    let comp = parseFloat(document.getElementById('arComp').value) || 0;
    let larg = parseFloat(document.getElementById('arLarg').value) || 0;
    let fatorSol = parseFloat(document.getElementById('arSol').value) || 600;
    let pessoas = parseInt(document.getElementById('arPessoas').value) || 1;
    let eletro = parseInt(document.getElementById('arEletro').value) || 0;

    let area = comp * larg;
    let btuPessoas = (pessoas > 1) ? (pessoas - 1) * fatorSol : 0;
    let btuEletro = eletro * 600;
    let btuTotal = (area * fatorSol) + btuPessoas + btuEletro;

    document.getElementById('resArArea').innerText = `${area.toFixed(1)} m²`;
    document.getElementById('resArBtuExato').innerText = `${Math.round(btuTotal).toLocaleString('pt-BR')} BTU/h`;

    let recomendado = '9.000 BTU/h';
    if (btuTotal > 9000 && btuTotal <= 12000) recomendado = '12.000 BTU/h';
    else if (btuTotal > 12000 && btuTotal <= 18000) recomendado = '18.000 BTU/h';
    else if (btuTotal > 18000 && btuTotal <= 24000) recomendado = '24.000 BTU/h';
    else if (btuTotal > 24000) recomendado = '30.000+ BTU/h';

    document.getElementById('resArBtuRecomendado').innerText = recomendado;
  }

  function salvarVisita() {
    let cli = document.getElementById('vCliente').value.trim();
    let tel = document.getElementById('vTel').value.trim();
    let data = document.getElementById('vData').value;
    let hora = document.getElementById('vHora').value;
    let end = document.getElementById('vEndereco').value.trim();
    let tipo = document.getElementById('vTipo').value;
    let obs = document.getElementById('vObs').value.trim();

    if (!cli || !data) {
      alert('Preencha ao menos o nome do cliente e a data da visita.');
      return;
    }

    visitas.push({ id: Date.now(), cli, tel, data, hora, end, tipo, obs });
    
    document.getElementById('vCliente').value = '';
    document.getElementById('vTel').value = '';
    document.getElementById('vEndereco').value = '';
    document.getElementById('vObs').value = '';

    renderizarVisitas();
  }

  function renderizarVisitas() {
    let lista = document.getElementById('listaVisitas');
    lista.innerHTML = '';

    visitas.forEach(v => {
      let li = document.createElement('li');
      li.innerHTML = `
        <div class="item-info">
          <span class="item-title">${v.cli} (${v.tipo})</span>
          <span class="item-sub">📅 ${v.data} às ${v.hora} | 📍 ${v.end}</span>
          ${v.obs ? `<span class="item-sub">📝 ${v.obs}</span>` : ''}
        </div>
      `;
      lista.appendChild(li);
    });
  }

  function enviarWhatsApp() {
    let cliente = document.getElementById('clienteNome').value.trim() || 'Cliente';
    let tel = document.getElementById('clienteTel').value.replace(/\D/g, '');
    let forma = document.getElementById('formaPagamento').value;
    let total = document.getElementById('valorTotal').innerText;
    let entrada = parseFloat(document.getElementById('entradaValor').value) || 0;

    if (itensOrcamento.length === 0) {
      alert('Adicione ao menos um serviço para gerar a mensagem!');
      return;
    }

    let msg = `*ERTEC SOLUÇÕES ELÉTRICAS*\n`;
    msg += `*Orçamento para:* ${cliente}\n\n`;
    msg += `*Serviços Relacionados:*\n`;

    itensOrcamento.forEach(i => {
      msg += `• ${i.nome} (${i.qtd}x) - R$ ${i.total.toFixed(2)}\n`;
    });

    let taxa = parseFloat(document.getElementById('taxaExtra').value) || 0;
    if (taxa > 0) {
      msg += `• Taxa de Materiais/Deslocamento: R$ ${taxa.toFixed(2)}\n`;
    }

    msg += `\n*Valor Total:* ${total}\n`;
    if (entrada > 0) {
      msg += `*Entrada:* R$ ${entrada.toFixed(2)}\n`;
    }
    msg += `*Forma de Pagamento:* ${forma}\n\n`;
    msg += `_Orçamento válido por 15 dias._`;

    let url = `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }
</script>
